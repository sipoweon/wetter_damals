<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetter-Zeitreise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wetter-Zeitreise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f2ee; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#e3e2dd; --grid:#e9e8e3;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8983;
  --band:rgba(0,0,0,.045); --accent:#2a78d6; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  /* je Kennzahl eine Rampe: 0 = aktuelles Jahr (kräftig) … 5 = vor 5 Jahren (blass) */
  --t0:#8a3a0c; --t1:#b04a12; --t2:#d95f1c; --t3:#eb7a3c; --t4:#f2a06e; --t5:#f7c39f;
  --p0:#104281; --p1:#1c5cab; --p2:#2a78d6; --p3:#3987e5; --p4:#6da7ec; --p5:#9ec5f4;
  --s0:#7a5a00; --s1:#9c7400; --s2:#c09000; --s3:#dcab12; --s4:#e9c454; --s5:#f2da8f;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#111110; --surface-1:#1a1a19; --surface-2:#242422; --border:#2f2f2c; --grid:#2a2a28;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --band:rgba(255,255,255,.05); --accent:#3987e5; --shadow:none;
    --t0:#fbd5bb; --t1:#f5ad7f; --t2:#ee8a4c; --t3:#d96a2a; --t4:#b0531e; --t5:#8a4116;
    --p0:#cde2fb; --p1:#9ec5f4; --p2:#6da7ec; --p3:#3987e5; --p4:#256abf; --p5:#184f95;
    --s0:#fdf0b8; --s1:#f9df7a; --s2:#f2c94c; --s3:#d9a91f; --s4:#b08612; --s5:#86660c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary)}
body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 40px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,6.5vw,40px);letter-spacing:-.02em;margin:0 0 16px;line-height:1.05}

.controls{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media (min-width:640px){.controls{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;height:44px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.combo{position:relative}
.suggest{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:280px;overflow:auto}
.suggest li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column}
.suggest li small{color:var(--text-muted)}
.suggest li[aria-selected=true],.suggest li:hover{background:var(--surface-2)}
.daterow{display:flex;gap:6px}
.daterow input{flex:1;min-width:0}
.btn{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border);border-radius:10px;height:44px;min-width:44px;padding:0 10px;cursor:pointer}

#status{min-height:20px;color:var(--text-secondary);font-size:14px;margin:0 2px 8px}
#status.err{color:#d03b3b}
.loading .panel{opacity:.5;transition:opacity .2s}

.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:16px 14px 10px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.place{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
.place small{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:var(--text-muted);margin-left:6px}
.metric{position:relative;flex:0 0 auto}
.metric select{appearance:none;-webkit-appearance:none;width:auto;min-width:210px;padding:0 38px 0 32px;font-weight:500;background:var(--surface-2)}
.metric::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:3px;background:var(--dot);pointer-events:none}
.metric::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--text-secondary);border-bottom:2px solid var(--text-secondary);transform:rotate(45deg);pointer-events:none}
.unit{font-size:13px;color:var(--text-muted);margin:0 2px 2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--text-secondary);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.sw.dashed{background-image:repeating-linear-gradient(90deg,transparent 0 3px,var(--surface-1) 3px 5px)!important}

.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .grid.zero{stroke:var(--text-muted);stroke-opacity:.6}
.chart .tick{fill:var(--text-muted);font-size:11px;font-family:inherit}
.chart .tick.strong{fill:var(--text-primary);font-weight:700}
.chart .band{fill:var(--band)}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.dashed{stroke-dasharray:5 4}
.chart .dot{stroke:var(--surface-1);stroke-width:2}
.chart .endlabel{fill:var(--text-secondary);font-size:12px;font-weight:500}
.chart .cross{stroke:var(--text-muted);stroke-width:1;stroke-dasharray:2 3}
.chart .hit{fill:transparent;cursor:crosshair;touch-action:pan-y}
.empty{color:var(--text-muted);font-size:14px;padding:24px 0;text-align:center}

footer{color:var(--text-muted);font-size:12px;margin-top:16px;line-height:1.5}
footer a{color:var(--text-secondary)}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.16);font-size:13px;min-width:160px}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:7px;padding:1px 0}
.tip .tn{color:var(--text-secondary);flex:1}
.tip .tv{font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Wetter-Zeitreise</h1>

  <section class="controls">
    <div class="field">
      <label for="city">Stadt</label>
      <div class="combo">
        <input type="text" id="city" autocomplete="off" spellcheck="false" placeholder="Stadt suchen …" role="combobox" aria-expanded="false" aria-controls="suggest">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="field">
      <label for="date">Stichtag</label>
      <div class="daterow">
        <button class="btn" id="prev" aria-label="Einen Tag zurück">‹</button>
        <input type="date" id="date">
        <button class="btn" id="next" aria-label="Einen Tag vor">›</button>
        <button class="btn" id="today">Heute</button>
      </div>
    </div>
  </section>

  <div id="status" role="status"></div>

  <section class="panel">
    <div class="panel-head">
      <div class="place" id="place"></div>
      <div class="metric" id="metricWrap">
        <select id="metric" aria-label="Kennzahl">
          <option value="tmax">Max. Temperatur</option>
          <option value="pr">Niederschlag</option>
          <option value="sun">Sonnenstunden</option>
        </select>
      </div>
    </div>
    <div class="unit" id="unit"></div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"></div>
  </section>

  <footer>
    Daten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0), ERA5-Reanalyse – modellierte Rasterwerte, keine Stationsmessung.
    Je blasser die Farbe, desto älter das Jahr. Gestrichelt = aktuelles Jahr, Tage nach heute sind Vorhersage.
  </footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
const API_GEO  = 'https://geocoding-api.open-meteo.com/v1/search';
const API_ARCH = 'https://archive-api.open-meteo.com/v1/archive';
const API_FC   = 'https://api.open-meteo.com/v1/forecast';
const DAILY = 'temperature_2m_max,precipitation_sum,sunshine_duration';
const OFFSETS = [0,1,2,3,4,5];
const METRICS = {
  tmax: {label:'Max. Temperatur', unit:'°C · Stichtag ± 3 Tage', ramp:'t', fmt:v => `${f1(v)} °C`, zero:false},
  pr:   {label:'Niederschlag',    unit:'mm pro Tag · Stichtag ± 3 Tage', ramp:'p', fmt:v => `${f1(v)} mm`, zero:true, minMax:2},
  sun:  {label:'Sonnenstunden',   unit:'Stunden pro Tag · Stichtag ± 3 Tage', ramp:'s', fmt:v => `${f1(v)} h`, zero:true, minMax:2}
};

const $ = s => document.querySelector(s);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

// ---------- Datum ----------
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
const utc = s => { const {y,m,d} = parse(s); return Date.UTC(y,m-1,d); };
const shiftYears = (s,n) => { const {y,m,d} = parse(s); const ny = y-n; const nd = (m===2 && d===29 && !isLeap(ny)) ? 28 : d; return `${ny}-${pad(m)}-${pad(nd)}`; };
const addDays = (s,k) => { const t = new Date(utc(s) + k*864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; };
const weekday = s => WD[new Date(utc(s)).getUTCDay()];
const fmtShort = s => { const {m,d} = parse(s); return `${d}.${m}.`; };
const daysAgo = s => Math.round((utc(todayStr()) - utc(s)) / 864e5);

// ---------- Zahlen ----------
const nf1 = new Intl.NumberFormat('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const ok = v => v!=null && !Number.isNaN(v);
const f1 = v => ok(v) ? nf1.format(Math.abs(v) < 0.05 ? 0 : v) : '–';

// ---------- Zustand ----------
const DEFAULT_PLACE = {name:'Dresden', admin1:'Sachsen', country:'Deutschland', lat:51.05089, lon:13.73832};
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = {
  place: store.get('wz-place') || DEFAULT_PLACE,
  date: todayStr(),
  metric: METRICS[store.get('wz-metric')] ? store.get('wz-metric') : 'tmax',
  data: {},
  token: 0
};
const canNow = () => { const a = daysAgo(state.date); return a >= 0 && a <= 60; };
const ago = o => o===0 ? 'jetzt' : `vor ${o} ${o===1?'Jahr':'Jahren'}`;
const visible = () => OFFSETS.filter(o => state.data[o]);
const color = o => `var(--${METRICS[state.metric].ramp}${o})`;
const meta = o => ({ color:color(o), dashed:o===0, name:`${state.data[o].year} · ${ago(o)}`, short:String(state.data[o].year) });

// ---------- Daten ----------
async function fetchYear(o, place, date){
  const center = shiftYears(date, o);
  const p = new URLSearchParams({ latitude:place.lat, longitude:place.lon, start_date:addDays(center,-3), end_date:addDays(center,3),
    daily:DAILY, timezone:'auto' });
  const r = await fetch(`${o===0 ? API_FC : API_ARCH}?${p}`);
  if (!r.ok) { let msg = `HTTP ${r.status}`; try { msg = (await r.json()).reason || msg; } catch {} throw new Error(msg); }
  const D = (await r.json()).daily;
  const days = [];
  for (let k=-3; k<=3; k++){
    const ds = addDays(center,k), i = D.time.indexOf(ds);
    days.push(i<0 ? {date:ds} : { date:ds, tmax:D.temperature_2m_max[i], pr:D.precipitation_sum[i],
      sun: ok(D.sunshine_duration[i]) ? D.sunshine_duration[i]/3600 : null });
  }
  return { offset:o, year:parse(center).y, days };
}

async function load(){
  const token = ++state.token;
  const place = state.place, date = state.date;
  const offs = OFFSETS.filter(o => o>0 || canNow());
  document.body.classList.add('loading');
  setStatus('Lade Wetterdaten …');
  const res = await Promise.allSettled(offs.map(o => fetchYear(o, place, date)));
  if (token !== state.token) return;
  document.body.classList.remove('loading');
  const data = {}, errs = [];
  res.forEach((r,i) => r.status==='fulfilled' ? data[offs[i]] = r.value : errs.push(r.reason));
  if (!Object.keys(data).length){
    setStatus(`Daten konnten nicht geladen werden${errs[0] ? ` (${errs[0].message})` : ''}. Besteht eine Internetverbindung?`, true);
    return;
  }
  state.data = data;
  setStatus(errs.length ? 'Einige Jahre konnten nicht geladen werden.' : '');
  render();
}
function setStatus(t, err=false){ const s = $('#status'); s.textContent = t; s.classList.toggle('err', err); }

// ---------- Rendering ----------
function render(){
  const p = state.place, M = METRICS[state.metric], vis = visible();
  $('#place').innerHTML = `${esc(p.name)}<small>${esc(p.country || '')}</small>`;
  $('#metricWrap').style.setProperty('--dot', `var(--${M.ramp}0)`);
  $('#unit').textContent = M.unit;
  $('#legend').innerHTML = vis.map(o => { const m = meta(o);
    return `<span><span class="sw${m.dashed?' dashed':''}" style="background:${m.color}"></span>${esc(m.name)}</span>`; }).join('');
  const labels = [-3,-2,-1,0,1,2,3].map(k => fmtShort(addDays(state.date,k)));
  // ältere (blassere) Linien zuerst zeichnen, das aktuelle Jahr liegt obenauf
  const series = vis.slice().reverse().map(o => ({...meta(o), values: state.data[o].days.map(d => d[state.metric] ?? null)}));
  lineChart($('#chart'), {labels, series, center:3, fmt:M.fmt, zero:M.zero, minMax:M.minMax,
    tipTitle:i => { const ds = addDays(state.date, i-3), off = i-3;
      return `${weekday(ds)}, ${fmtShort(ds)} · ${off===0 ? 'Stichtag' : `${off>0?'+':'−'}${Math.abs(off)} ${Math.abs(off)===1?'Tag':'Tage'}`}`; }});
}

// ---------- Diagramm ----------
function niceTicks(lo, hi, count=4){
  if (lo === hi){ lo -= 1; hi += 1; }
  const raw = (hi-lo)/count, mag = 10 ** Math.floor(Math.log10(raw)), n = raw/mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const t = []; for (let v = Math.floor(lo/step)*step; v <= Math.ceil(hi/step)*step + step/2; v += step) t.push(+v.toFixed(6));
  return t;
}
const tickFmt = (v, t) => (t[1]-t[0]) < 1 ? nf1.format(v) : nf0.format(v);

function lineChart(el, o){
  const W = Math.max(280, el.clientWidth), H = Math.round(Math.max(260, Math.min(380, W*0.62)));
  const m = {t:12, r:46, b:28, l:34}, n = o.labels.length, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const vals = o.series.flatMap(s => s.values).filter(ok);
  if (!vals.length){ el.innerHTML = '<p class="empty">Keine Daten verfügbar.</p>'; return; }
  const lo = o.zero ? 0 : Math.min(...vals), hi = Math.max(o.minMax || -Infinity, ...vals);
  const ticks = niceTicks(lo, hi), y0 = ticks[0], y1 = ticks.at(-1);
  const X = i => m.l + i*iw/(n-1), Y = v => m.t + ih - (v-y0)/(y1-y0)*ih;
  const bw = iw/(n-1);
  let g = `<rect class="band" x="${X(o.center)-bw/2}" y="${m.t}" width="${bw}" height="${ih}" rx="8"/>`;
  ticks.forEach(t => g += `<line class="grid${t===0 && y0<0 ? ' zero':''}" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l-8}" y="${Y(t)}" dy=".32em" text-anchor="end">${tickFmt(t,ticks)}</text>`);
  o.labels.forEach((l,i) => g += `<text class="tick${i===o.center?' strong':''}" x="${X(i)}" y="${H-8}" text-anchor="middle">${l}</text>`);
  o.series.forEach(s => { let d = '', pen = false;
    s.values.forEach((v,i) => { if (!ok(v)){ pen = false; return; } d += `${pen?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    g += `<path class="line${s.dashed?' dashed':''}" d="${d}" style="stroke:${s.color}"/>`;
    s.values.forEach((v,i) => { if (ok(v)) g += `<circle class="dot" cx="${X(i)}" cy="${Y(v)}" r="${i===o.center?5.5:4}" style="fill:${s.color}"/>`; });
  });
  const ends = o.series.map(s => { let i = s.values.length-1; while (i>=0 && !ok(s.values[i])) i--; return i<0 ? null : {t:s.short, x:X(i), y:Y(s.values[i])}; })
    .filter(Boolean).sort((a,b) => a.y-b.y);
  for (let k=1; k<ends.length; k++) if (ends[k].y - ends[k-1].y < 13) ends[k].y = ends[k-1].y + 13;
  const floor = m.t + ih + 4;
  for (let k=ends.length-1; k>=0; k--){ const lim = floor - (ends.length-1-k)*13; if (ends[k].y > lim) ends[k].y = lim; }
  ends.forEach(e => g += `<text class="endlabel" x="${e.x+9}" y="${e.y}" dy=".32em">${e.t}</text>`);
  g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" visibility="hidden"/>`;
  g += `<rect class="hit" x="${m.l-12}" y="0" width="${iw+24}" height="${H}"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${g}</svg>`;
  const svg = el.firstChild, cross = svg.querySelector('.cross'), hit = svg.querySelector('.hit');
  const rows = i => o.series.slice().reverse().map(s => ({color:s.color, dashed:s.dashed, name:s.name, v:s.values[i]}));
  const move = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)*W/r.width;
    const i = Math.max(0, Math.min(n-1, Math.round((px-m.l)/bw)));
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('visibility','visible');
    showTip(e, o.tipTitle(i), rows(i), o.fmt); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', e => { if (e.pointerType==='mouse') hideTip(); });
}

const tip = $('#tip');
function showTip(e, title, rows, fmt){
  tip.innerHTML = `<div class="tt">${title}</div>` + rows.map(r =>
    `<div class="tr"><span class="sw${r.dashed?' dashed':''}" style="background:${r.color}"></span><span class="tn">${esc(r.name)}</span><span class="tv">${ok(r.v) ? fmt(r.v) : '–'}</span></div>`).join('');
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight, p = 14;
  let x = e.clientX + p, y = e.clientY - th - p;
  if (x + tw > innerWidth - 8) x = e.clientX - tw - p;
  if (x < 8) x = 8;
  if (y < 8) y = e.clientY + p;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip(){ tip.hidden = true; document.querySelectorAll('.chart .cross').forEach(c => c.setAttribute('visibility','hidden')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.chart')) hideTip(); });
addEventListener('scroll', () => { if (!tip.hidden) hideTip(); }, {passive:true});

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- Steuerung ----------
const metricSel = $('#metric');
metricSel.value = state.metric;
metricSel.addEventListener('change', () => { state.metric = metricSel.value; store.set('wz-metric', state.metric); hideTip(); if (visible().length) render(); });

const dateIn = $('#date');
function setDate(s){ const t = todayStr(); if (s > t) s = t; state.date = s; dateIn.value = s; load(); }
dateIn.max = todayStr(); dateIn.value = state.date;
dateIn.addEventListener('change', () => dateIn.value && setDate(dateIn.value));
$('#prev').onclick = () => setDate(addDays(state.date,-1));
$('#next').onclick = () => setDate(addDays(state.date, 1));
$('#today').onclick = () => setDate(todayStr());

// Stadtsuche
const cityIn = $('#city'), sug = $('#suggest');
let results = [], active = -1, debounce, qToken = 0;
cityIn.value = state.place.name;
cityIn.addEventListener('focus', () => cityIn.select());
cityIn.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = cityIn.value.trim();
  if (q.length < 2){ closeSug(); return; }
  debounce = setTimeout(() => search(q), 220);
});
async function search(q){
  const t = ++qToken;
  try {
    const r = await fetch(`${API_GEO}?${new URLSearchParams({name:q, count:7, language:'de', format:'json'})}`);
    const j = await r.json(); if (t !== qToken) return;
    results = (j.results || []).map(x => ({name:x.name, admin1:x.admin1, country:x.country, lat:x.latitude, lon:x.longitude}));
    active = results.length ? 0 : -1;
    drawSug();
  } catch { if (t === qToken){ results = []; sug.innerHTML = '<li><small>Suche nicht erreichbar.</small></li>'; sug.hidden = false; } }
}
function drawSug(){
  sug.innerHTML = results.length ? results.map((p,i) => `<li role="option" data-i="${i}" aria-selected="${i===active}">${esc(p.name)}<small>${esc([p.admin1,p.country].filter(Boolean).join(', '))}</small></li>`).join('')
    : '<li><small>Keine Stadt gefunden.</small></li>';
  sug.hidden = false; cityIn.setAttribute('aria-expanded','true');
}
function closeSug(){ sug.hidden = true; cityIn.setAttribute('aria-expanded','false'); }
function pick(i){
  const p = results[i]; if (!p) return;
  state.place = p; store.set('wz-place', p);
  cityIn.value = p.name; closeSug(); cityIn.blur(); load();
}
sug.addEventListener('pointerdown', e => { const li = e.target.closest('li[data-i]'); if (li){ e.preventDefault(); pick(+li.dataset.i); } });
cityIn.addEventListener('keydown', e => {
  if (sug.hidden) return;
  if (e.key === 'ArrowDown'){ active = Math.min(results.length-1, active+1); drawSug(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ active = Math.max(0, active-1); drawSug(); e.preventDefault(); }
  else if (e.key === 'Enter'){ pick(active < 0 ? 0 : active); e.preventDefault(); }
  else if (e.key === 'Escape'){ closeSug(); }
});
cityIn.addEventListener('blur', () => setTimeout(() => { closeSug(); if (!cityIn.value.trim()) cityIn.value = state.place.name; }, 150));

let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (visible().length) render(); }, 120); }).observe($('#app'));

load();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
